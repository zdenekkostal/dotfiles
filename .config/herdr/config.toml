onboarding = false
# herdr defaults are kept; tmux-style keys (~/.tmux.conf) are added alongside.
# Only keys that differ from the defaults are listed. herdr "workspace" ~ tmux
# session, herdr "tab" ~ tmux window.

[keys]
prefix = ["ctrl+a", "ctrl+b"]

# Splits: v / | right, - down
split_vertical = ["prefix+v", "prefix+|"]

# Tabs (tmux windows)
rename_tab = ["prefix+shift+t", "prefix+comma"]
close_tab = ["prefix+shift+x", "prefix+ampersand"]
move_tab_previous = "prefix+<"
move_tab_next = "prefix+>"

# Panes: h/j/k/l as default, plus arrow up
focus_pane_up = ["prefix+k", "prefix+up"]
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"

# Session-ish
detach = ["prefix+q", "prefix+d"]
workspace_picker = ["prefix+w", "prefix+s"]
settings = "prefix+shift+s"   # default prefix+s is now the picker

# Worktrees, all shift: g new (default), o open, u remove (asks to confirm)
open_worktree = "prefix+shift+o"
remove_worktree = "prefix+shift+u"

# Ctrl+p clears the pane (tmux: bind -n C-p)
clear_pane = "ctrl+p"

# Seamless ctrl+h/j/k/l between nvim splits and herdr panes (aimdevlee/herdr-nvim-nav)
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-nvim-nav.left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-nvim-nav.down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-nvim-nav.up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-nvim-nav.right"

# Command bar / session switcher (jeffarese/herdr-bar). ctrl+alt+k is what Cmd+K sends
# when the terminal maps it (Ghostty: keybind = cmd+k=text:\x1b[107;7u).
[[keys.command]]
key = ["prefix+space", "ctrl+alt+k"]
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"
