onboarding = false
# Keybindings mirror ~/.tmux.conf (prefix C-a, vim pane nav, | and - splits).
# herdr "workspace" ~ tmux session, herdr "tab" ~ tmux window.

[keys]
prefix = "ctrl+a"

# Splits: | right, - down
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"

# Windows (tabs)
new_tab = "prefix+c"
next_tab = "prefix+n"
previous_tab = "prefix+p"
rename_tab = "prefix+comma"
close_tab = "prefix+ampersand"
move_tab_previous = "prefix+<"
move_tab_next = "prefix+>"

# Panes: vim-style focus (h/j/k/l), resize with H/J/K/L
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"
resize_mode = ""
cycle_pane_next = "prefix+o"
open_notification_target = ""
zoom = "prefix+z"
close_pane = "prefix+x"

# Session-ish
detach = "prefix+d"
workspace_picker = "prefix+s"
settings = "prefix+shift+s"
reload_config = "prefix+r"

# Ctrl+p clears the pane (tmux: bind -n C-p)
clear_pane = "ctrl+p"

[theme]
name = "rose-pine"
auto_switch = false
